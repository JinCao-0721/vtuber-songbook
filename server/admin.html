<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Songbook 管理后台</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#292433;background:#f8f5fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font:500 2.5rem Georgia,serif;margin:0}.muted{color:#8e8797;font-size:.86rem}.panel{background:white;border:1px solid #e6dfea;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px #4225500a}label{display:grid;gap:6px;color:#716878;font-size:.8rem}input,textarea,select{width:100%;border:1px solid #ddd4e3;border-radius:9px;padding:10px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}button{border:0;border-radius:999px;padding:10px 17px;background:#282132;color:#fff;cursor:pointer;font:inherit}.secondary{background:#f0e8f2;color:#4d4055}.danger{background:#f8e0ea;color:#a23362}.actions{display:flex;gap:8px;align-items:center}.song{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee8f0;padding:14px 0}.song:first-child{border-top:0}.song h3{margin:0 0 5px;font:500 1.2rem Georgia,serif}.tag{color:#cf6997;font-size:.72rem}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header{align-items:flex-start;gap:15px;flex-direction:column}}
</style></head>
<body><main class="wrap"><header><div><p class="muted">SONGBOOK / ADMIN</p><h1>管理后台</h1></div><button id="logout" class="secondary hidden">退出登录</button></header>
<section id="login" class="panel"><h2>管理员登录</h2><p class="muted">使用管理员账号和密码登录。</p><form id="loginForm" class="actions"><input id="username" placeholder="管理员账号" required><input id="password" type="password" placeholder="管理员密码" required><button>登录</button></form><p id="loginError" class="muted"></p></section>
<section id="app" class="hidden"><div class="panel"><div class="actions"><h2>歌曲</h2></div><div id="songList"></div></div>
<section class="panel"><h2 id="formTitle">编辑歌曲信息</h2><p class="muted">歌曲名称、原唱、时长和 QQ 音乐链接由歌单导入；这里仅修改分类、简介、主题色和 BV 号。</p><form id="songForm" class="grid"><label>Slug<input name="slug" readonly required></label><label>标题<input name="title" readonly required></label><label>类型<select name="type"><option>翻唱</option><option>原创</option><option>BGM</option></select></label><label>演唱者<input name="artist" readonly></label><label>原唱<input name="originalArtist" readonly></label><label>时长<input name="duration" readonly placeholder="04:25"></label><label>主题色<input name="accent" value="#f0a6ca"></label><label class="full">简介<textarea name="description"></textarea></label><label class="full">Bilibili BV 号<input name="bvid" placeholder="BV1Q2gK6hE3A"></label><div class="actions full"><button>保存修改</button><button type="button" id="cancel" class="secondary">清空</button></div></form><p id="status" class="muted"></p></section>
<p class="panel muted">音频由 QQ 音乐和 Bilibili 下载脚本整理后放入 <code>public/media/</code>；本后台只维护歌曲资料和音频路径，不提供上传功能。</p></section></main>
<section id="playlistImport" class="panel hidden"><h2>从 QQ 歌单导入</h2><p class="muted">歌单是这个 VUP 的歌曲目录；读取后给每首歌填写对应的 Bilibili BV 号，再导入网站。</p><form id="playlistForm" class="actions"><input id="playlistId" placeholder="QQ 歌单 ID，例如 9778393815" required><button>读取歌单</button></form><p id="playlistStatus" class="muted"></p><div id="importList"></div></section>
<section id="userPanel" class="panel hidden"><h2>管理员账号</h2><form id="userForm" class="actions"><input name="username" placeholder="账号" required><input name="password" type="password" placeholder="至少 8 位密码" required><select name="role"><option value="editor">editor · 歌曲编辑</option><option value="viewer">viewer · 只读</option><option value="owner">owner · 全部权限</option></select><button>创建账号</button></form><div id="userList"></div><p id="userStatus" class="muted"></p></section>
<script>
let token=localStorage.getItem('songbook-admin-token')||'', songs=[], editing=null, currentUser=null;
const $=s=>document.querySelector(s), api=async(url,opt={})=>{opt.headers={...(opt.headers||{}),Authorization:`Bearer ${token}`};const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.json()).error||'请求失败');return r.status===204?null:r.json()};
function showApp(){ $('#login').classList.toggle('hidden',!!token);$('#app').classList.toggle('hidden',!token);$('#playlistImport').classList.toggle('hidden',!token || !['owner','editor'].includes(currentUser?.role));$('#userPanel').classList.toggle('hidden',!token || currentUser?.role!=='owner');$('#logout').classList.toggle('hidden',!token);if(token)load(); }
async function load(){try{currentUser=await api('/api/me');songs=await api('/api/songs');render();$('#playlistImport').classList.toggle('hidden',!['owner','editor'].includes(currentUser.role));$('#userPanel').classList.toggle('hidden',currentUser.role!=='owner');if(currentUser.role==='owner')loadUsers();}catch(e){token='';currentUser=null;localStorage.removeItem('songbook-admin-token');showApp();$('#loginError').textContent=e.message;}}
function render(){ $('#songList').innerHTML=songs.map(s=>`<div class="song"><div><h3>${s.title}</h3><span class="tag">${s.type} · ${s.slug}</span><p class="muted">${(s.audio||[]).map(a=>a.label).join(' / ')||'暂无音频路径'}</p></div><div class="actions"><button class="secondary" data-edit="${s.slug}">编辑</button><button class="danger" data-delete="${s.slug}">删除</button></div></div>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeSong(b.dataset.delete));}
function edit(slug){const s=songs.find(x=>x.slug===slug);editing=slug;const f=$('#songForm');Object.entries({...s,bvid:s.bilibiliBvid||'',qq:s.links?.qq||''}).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v||''});f.elements.slug.disabled=true;$('#formTitle').textContent=`编辑：${s.title}`;scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
async function removeSong(slug){if(!confirm('确认删除这首歌曲的数据？'))return;try{await api(`/api/songs/${slug}`,{method:'DELETE'});editing=null;await load();}catch(e){alert(e.message)}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error);token=data.token;currentUser=data.user;localStorage.setItem('songbook-admin-token',token);showApp();}catch(e){$('#loginError').textContent=e.message}};
$('#logout').onclick=()=>{token='';currentUser=null;localStorage.removeItem('songbook-admin-token');showApp()};$('#cancel').onclick=()=>{$('#songForm').reset();editing=null;$('#formTitle').textContent='编辑歌曲信息'};
$('#songForm').onsubmit=async e=>{e.preventDefault();if(!editing){$('#status').textContent='请先从 QQ 歌单导入歌曲';return;}const f=new FormData(e.target), body=Object.fromEntries(f);body.links={bilibili:body.bvid?`https://www.bilibili.com/video/${body.bvid}`:''};body.bilibiliBvid=body.bvid;delete body.bvid;try{await api(`/api/songs/${editing}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#status').textContent='已保存';await load();}catch(e){$('#status').textContent=e.message}};
function renderImport(items,playlistId){$('#importList').innerHTML=items.map(s=>`<div class="song"><div><h3>${s.title}</h3><span class="tag">${s.artist} · ${s.duration} · ${s.songMid}</span></div><div class="actions"><input data-bvid="${s.songMid}" placeholder="BV 号"><button data-import="${s.songMid}">导入并下载</button></div></div>`).join('');document.querySelectorAll('[data-import]').forEach(b=>b.onclick=async()=>{const input=document.querySelector(`[data-bvid="${b.dataset.import}"]`);if(!input.value.trim()){$('#playlistStatus').textContent='请先填写 BV 号';return;}b.disabled=true;b.textContent='下载中…';try{const result=await api('/api/songs/from-qq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playlistId,songMid:b.dataset.import,bvid:input.value.trim()})});$('#playlistStatus').textContent=result.downloadError?`歌曲已导入，但翻唱下载失败：${result.downloadError}`:`已导入并下载：${items.find(x=>x.songMid===b.dataset.import).title}`;await load();}catch(e){$('#playlistStatus').textContent=e.message;b.disabled=false;b.textContent='导入并下载';}})}
$('#playlistForm').onsubmit=async e=>{e.preventDefault();const playlistId=$('#playlistId').value.trim();try{const r=await api('/api/qq/playlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playlistId})});$('#playlistStatus').textContent=`${r.name}：${r.songs.length} 首歌曲`;renderImport(r.songs,playlistId);}catch(e){$('#playlistStatus').textContent=e.message}};
async function loadUsers(){try{const users=await api('/api/users');$('#userList').innerHTML=users.map(u=>`<div class="song"><div><strong>${u.username}</strong><span class="tag">${u.role}</span></div><button class="danger" data-user-delete="${u.username}">删除</button></div>`).join('');document.querySelectorAll('[data-user-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('确认删除该管理员？'))return;try{await api(`/api/users/${b.dataset.userDelete}`,{method:'DELETE'});loadUsers();}catch(e){$('#userStatus').textContent=e.message}});}catch(e){$('#userStatus').textContent=e.message}}
$('#userForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));try{await api('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});e.target.reset();$('#userStatus').textContent='账号已创建';loadUsers();}catch(e){$('#userStatus').textContent=e.message}};
showApp();
</script></body></html>
